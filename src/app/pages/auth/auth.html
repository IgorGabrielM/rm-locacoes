<div class="min-h-screen bg-surface-muted flex items-center justify-center p-4">
  <div class="w-full max-w-sm">

    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-primary mb-4 shadow-md">
        <i class="pi pi-building text-white text-2xl"></i>
      </div>
      <h1 class="text-2xl font-bold text-ink">RM Locações</h1>
      <p class="text-ink-muted text-sm mt-1">Gestão de contratos</p>
    </div>

    <div class="bg-surface rounded-2xl shadow-card border border-surface-border p-8">
      <h2 class="text-lg font-semibold text-ink mb-6">Acesso ao sistema</h2>
      <p-button
        label="Entrar com Google"
        icon="pi pi-google"
        styleClass="w-full"
        [style]="{'background':'#1e3a5f','border-color':'#1e3a5f','width':'100%','justify-content':'center'}"
        (onClick)="login()">
      </p-button>
      <p class="text-center text-xs text-ink-faint mt-5">
        Acesso restrito a colaboradores autorizados
      </p>
    </div>

  </div>
</div>
