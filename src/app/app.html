<router-outlet></router-outlet>

<!-- Modal global de erro HTTP -->
<div *ngIf="erroService.erro | async as mensagem"
     class="fixed inset-0 z-[99999] flex items-center justify-center p-5 bg-black/50 backdrop-blur-sm">
  <div class="w-full max-w-sm bg-surface rounded-2xl shadow-2xl border border-surface-border overflow-hidden">

    <div class="flex items-center justify-between px-5 py-4 border-b border-surface-border">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-full bg-red-50 flex items-center justify-center shrink-0">
          <i class="pi pi-times-circle text-red-600"></i>
        </div>
        <h3 class="font-semibold text-ink">Ocorreu um erro</h3>
      </div>
      <button type="button" (click)="erroService.fechar()"
              class="text-ink-faint hover:text-ink transition-colors p-1">
        <i class="pi pi-times text-sm"></i>
      </button>
    </div>

    <div class="px-5 py-4">
      <p class="text-sm text-ink-muted break-words">{{ mensagem }}</p>
    </div>

    <div class="px-5 pb-5">
      <button pButton type="button" label="Fechar" icon="pi pi-times"
              class="p-button-outlined w-full"
              [style]="{'justify-content':'center'}"
              (click)="erroService.fechar()">
      </button>
    </div>

  </div>
</div>
